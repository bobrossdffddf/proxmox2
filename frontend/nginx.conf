server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep any redirect nginx generates relative to the current origin.
  #
  # This container is published on a non-default port (8080 by default), and an
  # absolute redirect is built from server_name — so nginx answers with
  # "http://localhost/..." and silently drops the port. A browser following
  # that lands on port 80 where nothing is listening, and the fetch fails with
  # no usable error. A relative Location keeps scheme, host and port intact.
  absolute_redirect off;

  # Compress text assets (the console JS chunk is ~300 KB raw, ~85 KB gzipped).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Cache hashed assets aggressively, never cache index.html.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Single-page app fallback.
  location / {
    try_files $uri /index.html;
  }

  # VM image uploads. These are tens of gigabytes, so the default 1 MB body cap
  # has to go and the body must stream straight through rather than being
  # buffered to nginx's disk first. The backend enforces its own size limit
  # (IMPORT_MAX_UPLOAD_GB) as the request arrives.
  #
  # Matched on the whole import prefix rather than the upload path alone: the
  # upload URL carries the import id (/api/admin/imports/<id>/upload), so a
  # fixed path would silently stop matching and every upload would die at
  # nginx's 1 MB default.
  #
  # No trailing slash on the prefix, so /api/admin/imports itself is covered
  # too and every import endpoint goes through identical proxy settings.
  location /api/admin/imports {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    client_max_body_size 0;
    client_body_timeout 3600s;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API to backend.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy WebSocket for the Guacamole RDP bridge.
  location /ws/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400; # keep RDP sockets open
    proxy_send_timeout 86400;
    proxy_socket_keepalive on;
  }
}
